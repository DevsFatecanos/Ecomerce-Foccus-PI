services:
  - type: web
    name: pi-3-semestre
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    region: oregon
    healthCheckPath: /up
    port: 8080
    envVars:
      - key: APP_NAME
        value: "PI-3-Semestre"
      - key: APP_ENV
        value: "production"
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: APP_LOCALE
        value: "pt_BR"
      - key: APP_FALLBACK_LOCALE
        value: "pt_BR"
      - key: DB_CONNECTION
        value: "pgsql"
      - key: DB_HOST
        sync: false
        value: "aws-1-sa-east-1.pooler.supabase.com"
      - key: DB_PORT
        value: "5432"
      - key: DB_DATABASE
        value: "postgres"
      - key: DB_USERNAME
        sync: false
        value: "postgres.wgrqhvzrakgnvksakerd"
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSLMODE
        value: "require"
      - key: APP_URL
        value: "https://${RENDER_EXTERNAL_HOSTNAME}"
      - key: LOG_CHANNEL
        value: "stack"
      - key: LOG_LEVEL
        value: "info"
      - key: CACHE_STORE
        value: "file"
      - key: QUEUE_CONNECTION
        value: "sync"
      - key: SESSION_DRIVER
        value: "file"
      # Mercado Pago: token e URL do webhook sao preenchidos no painel do Render.
      # Sem o token, com CHECKOUT_TEST_MODE=false, o checkout recusa o pagamento.
      - key: MERCADO_PAGO_ACCESS_TOKEN
        sync: false
      - key: MERCADO_PAGO_WEBHOOK_URL
        sync: false
      - key: MERCADO_PAGO_SANDBOX
        value: "false"
      - key: CHECKOUT_TEST_MODE
        value: "false"
